name: karl-doorbell
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ring:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Karl (repository_dispatch on karl-tcb)
        env:
          TOKEN: ${{ secrets.KARL_DISPATCH_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/hitl-gate-lab/karl-tcb/dispatches \
            -d "{\"event_type\":\"judge-pr\",\"client_payload\":{\"repo\":\"hitl-gate-lab/playground\",\"pr_number\":$PR_NUMBER}}"
